<div class="mt-10 bg-slate-800 p-6 rounded-2xl border border-slate-700">
    <h2 class="text-xl font-bold mb-4">مدیریت کاربران</h2>
    <table class="w-full text-right">
        <thead>
            <tr class="text-gray-400 border-b border-slate-700">
                <th class="pb-2">نام کاربری</th>
                <th class="pb-2">حجم مصرفی</th>
                <th class="pb-2">وضعیت</th>
            </tr>
        </thead>
        <tbody>
            <template x-for="user in users" :key="user.id">
                <tr class="border-b border-slate-700/50">
                    <td class="py-3" x-text="user.username"></td>
                    <td class="py-3"><span x-text="(user.used_traffic_bytes / 1024**3).toFixed(2)"></span> / <span x-text="user.traffic_limit_gb"></span> GB</td>
                    <td class="py-3">
                        <span x-show="user.is_active" class="text-green-400">فعال</span>
                        <span x-show="!user.is_active" class="text-red-400">غیرفعال</span>
                    </td>
                </tr>
            </template>
        </tbody>
    </table>
</div>

<script>
    // اضافه کردن متغیر users به تابع statsApp
    function statsApp() {
        return {
            users: [],
            // ... کدهای قبلی ...
            async fetchUsers() {
                const res = await fetch('/api/users');
                this.users = await res.json();
            }
        }
    }
</script>
