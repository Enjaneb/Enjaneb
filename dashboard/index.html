<!DOCTYPE html>
<html>
<head>
    <title>ENJANEB Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="container py-5">
    <div class="row">
        <div class="col-md-4">
            <div class="card p-4">
                <h3>Add User</h3>
                <input id="u" class="form-control mb-2" placeholder="Username">
                <input id="p" class="form-control mb-2" placeholder="Password">
                <input id="l" type="number" class="form-control mb-2" placeholder="Limit (GB)">
                <input id="e" type="date" class="form-control mb-2">
                <button onclick="addUser()" class="btn btn-primary w-100">Create</button>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card p-4">
                <h3>Users List</h3>
                <table class="table">
                    <thead><tr><th>User</th><th>Pass</th><th>Limit</th><th>Actions</th></tr></thead>
                    <tbody id="userTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadUsers() {
            const res = await fetch('/api/users');
            const users = await res.json();
            const tbody = document.getElementById('userTable');
            tbody.innerHTML = '';
            users.forEach(u => {
                tbody.innerHTML += `<tr>
                    <td>${u.username}</td>
                    <td>${u.password}</td>
                    <td>${u.traffic_limit_gb} GB</td>
                    <td><button onclick="deleteUser('${u.username}')" class="btn btn-danger btn-sm">Delete</button></td>
                </tr>`;
            });
        }

        async function addUser() {
            const data = {
                username: document.getElementById('u').value,
                password: document.getElementById('p').value,
                limit_gb: parseFloat(document.getElementById('l').value),
                expiry: document.getElementById('e').value
            };
            await fetch('/api/users/add', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            location.reload();
        }

        async function deleteUser(username) {
            if(confirm('Are you sure?')) {
                await fetch('/api/users/delete/' + username, { method: 'DELETE' });
                location.reload();
            }
        }
        loadUsers();
    </script>
</body>
</html>
