<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENJANEB Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: Tahoma, sans-serif; }
    </style>
</head>
<body x-data="statsApp()" x-init="init()">
    <div class="min-h-screen p-6">
        <h1 class="text-3xl font-bold text-blue-400 mb-8 text-center">پنل مدیریت پروژه ENJANEB</h1>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <p class="text-gray-400">پردازنده (CPU)</p>
                <div class="text-3xl font-bold"><span x-text="cpu"></span>%</div>
            </div>
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <p class="text-gray-400">حافظه (RAM)</p>
                <div class="text-3xl font-bold"><span x-text="ram"></span>%</div>
            </div>
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-xl">
                <p class="text-gray-400">وضعیت سرور</p>
                <div class="text-3xl font-bold text-green-400" x-text="status"></div>
            </div>
        </div>

        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 mb-8">
            <h2 class="text-xl font-bold mb-4 text-blue-300">ساخت کاربر جدید</h2>
            <div class="flex flex-wrap gap-4">
                <input type="text" x-model="newUser.username" placeholder="نام کاربری" class="bg-slate-900 border border-slate-600 p-2 rounded flex-1">
                <input type="password" x-model="newUser.password" placeholder="رمز عبور" class="bg-slate-900 border border-slate-600 p-2 rounded flex-1">
                <input type="number" x-model="newUser.limit_gb" placeholder="حجم (GB)" class="bg-slate-900 border border-slate-600 p-2 rounded w-24">
                <button @click="addUser()" class="bg-blue-600 px-6 py-2 rounded font-bold hover:bg-blue-500">ذخیره</button>
            </div>
        </div>

        <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700">
            <h2 class="text-xl font-bold mb-4">لیست کاربران</h2>
            <table class="w-full text-right border-collapse text-sm">
                <thead>
                    <tr class="text-gray-400 border-b border-slate-700 text-right">
                        <th class="p-3">نام کاربری</th>
                        <th class="p-3">حجم (GB)</th>
                        <th class="p-3">وضعیت</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="user in users" :key="user.id">
                        <tr class="border-b border-slate-700/50">
                            <td class="p-3" x-text="user.username"></td>
                            <td class="p-3"><span x-text="user.traffic_limit_gb"></span> GB</td>
                            <td class="p-3 text-green-400">فعال</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function statsApp() {
            return {
                cpu: 0, ram: 0, status: '...', users: [],
                newUser: { username: '', password: '', limit_gb: 10, expiry: '2026-12-30' },
                init() {
                    this.fetchStats();
                    this.fetchUsers();
                    setInterval(() => this.fetchStats(), 3000);
                },
                async fetchStats() {
                    try {
                        const res = await fetch('/api/metrics');
                        const data = await res.json();
                        this.cpu = data.cpu; this.ram = data.ram; this.status = data.status;
                    } catch { this.status = 'Offline'; }
                },
                async fetchUsers() {
                    const res = await fetch('/api/users');
                    this.users = await res.json();
                },
                async addUser() {
                    await fetch('/api/users/add', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(this.newUser)
                    });
                    this.newUser.username = '';
                    this.fetchUsers();
                }
            }
        }
    </script>
</body>
</html>
